Problem:
  Viscosity: 0.04
  Density: 1.06
  BackflowBeta: 0.2
  Windkessels:
    Rd: [29543.2, 2861.7, 36890.4, 40126.1]
    Rp: [1554.9, 150.6, 1941.6, 2111.9]
    C:  [2.7215e-05, 2.8095e-04, 2.1794e-05, 2.0037e-05]
    Pd_init: 0.0
    NbIters: 1000
  SurfaceQuadratureDegree: 3
  # Degree 3, not 4. Every integrand in the P1-P1 forms is at most degree 2 in the
  # polynomial part, so a degree-3 rule integrates it exactly and leaves five points on a
  # tetrahedron to resolve tau_M, which is the only non-polynomial factor. Degree 4 costs 14
  # points for nothing: measured over 20 steps at a tight nonlinear tolerance, degree 3 is
  # 33 % faster per nonlinear iteration and every outlet flow, split and pressure agrees with
  # degree 4 to 8e-11. Degree 2 was also clean (7e-10) and a further 6 % faster; 3 keeps a
  # margin for tau_M on graded meshes.
  VolumeQuadratureDegree: 3
  VelocityProfileFile: "data/inflow/velocity_1cycles.flow"
  VelocityProfileScale: 1.0

Solver:
  Kind: "iterative"
  SolverIterations: 2000
  SolverRTol: 1.0e-8
  SolverATol: 1.0e-7
  SolverGMRESRestart: 50
  NonlinearTolerance: 1.0e-2
  MaxNonlinearIterations: 35

  # Nonlinear solver: "newton" or "picard"
  Scheme: "newton"

  # Every accepted solve on this case stops on SolverATol, not SolverRTol -- the ksp_reason
  # column of the diagnostics CSV records which (2 = ATOL, 3 = RTOL). Tune the absolute one.

  # How many time steps a BoomerAMG hierarchy is kept before being rebuilt, and the factor by
  # which the Krylov count may grow before it is rebuilt early. Reuse cannot change the answer:
  # FGMRES applies the true operator, the preconditioner only steers the search. Set the period
  # to 0 to rebuild on every solve, which is what this code did before.
  PreconditionerRefresh: 5
  PreconditionerGuard: 1.5

  # BoomerAMG for tetrahedra. PETSc's default strong_threshold is 0.25, the two-dimensional
  # value; on 3D meshes it coarsens far too slowly. Measured 12.1 -> 9.0 s/step at 8 ranks with
  # the Krylov count unchanged, and flat across 0.5/0.6/0.7, so this is a plateau not an edge.
  AMGStrongThreshold: 0.5
  AMGCoarsenType: "HMIS"
  AMGInterpType: "ext+i"
  AMGAggressiveLevels: 1

Geometry:
  MeshFile: "data/aorta/11mmrest/mesh_volume.xdmf"
  BoundariesFile: "data/aorta/11mmrest/mesh_surface.xdmf"
  WallID: 4
  InletID: 5
  OutletIDs: [6, 9, 7, 8]

Run:
  Output: "output/aorta11"
  Element: "P1-P1"
  InletPlateauLambda: 0.15
  MaxSteps: null
  StoreAfter: null
  StoreEvery: 10
  Verbose: true
