# DFG 2D flow-around-a-cylinder benchmark (Schaefer & Turek, 1996).
#
# Non-dimensional: rho = 1, mu = nu = 1e-3.  With characteristic length D = 0.1 and mean
# inflow Ubar = 1.0 (case 2d3 / 2d2) this is Re = 100; case 2d1 uses Ubar = 0.2, Re = 20.
Problem:
  Density: 1.0
  Viscosity: 1.0e-3
  BackflowBeta: 0.0          # the outlet is do-nothing; no reversal at these Reynolds numbers
  SurfaceQuadratureDegree: 4
  VolumeQuadratureDegree: 4
  VelocityProfileFile: null  # the inflow is analytic; see run.py
  VelocityProfileScale: 1.0

Solver:
  Kind: "direct"             # the benchmark meshes are small enough for MUMPS
  SolverIterations: 2000
  SolverRTol: 1.0e-10
  SolverATol: 1.0e-12
  SolverGMRESRestart: 200
  NonlinearTolerance: 1.0e-8
  MaxNonlinearIterations: 30

  # Nonlinear solver: "newton" or "picard"
  Scheme: "picard"

Geometry:
  # Walls and obstacle are separate tags so drag can be integrated over the cylinder
  # alone, but both carry no-slip.
  WallID: [4, 5]
  InletID: 2
  OutletIDs: [3]
  ObstacleID: 5

Run:
  Case: "2d3"          # 2d1 (steady, Re 20), 2d2 (steady, Re 100) or 2d3 (ramped, Re 100)
  Output: "output/turek"
  Element: "P1-P1"
  ResMin: null         # element size at the cylinder; null uses R/2, a smoke-test mesh
  TimeStep: 0.02
  TEnd: null           # null uses the case's own final time
  MaxSteps: null       # null runs to TEnd
  StoreAfter: null     # first step written to XDMF; null writes no fields
  StoreEvery: 10
  Verbose: true
